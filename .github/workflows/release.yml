name: Release

# Publica o instalador Windows nas Releases do GitHub. É esse artefato que o
# app instalado consulta para se atualizar sozinho (electron-updater).
#
# Como disparar:
#   npm version 0.2.0        # sobe a versão e cria a tag v0.2.0
#   git push --follow-tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # necessário para criar a release e subir os artefatos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # O postinstall (electron-builder install-app-deps) recompila o
      # better-sqlite3 para o Electron do Windows aqui no runner — é por isso
      # que o build não sai do Ubuntu/Mac.
      - run: npm ci

      - run: npm run typecheck

      # `--publish never`: quem sobe os artefatos é o passo seguinte, com o `gh`.
      # O uploader do electron-builder encerra o processo com sucesso poucos
      # segundos depois de *começar* os uploads — o .blockmap (100 KB) chega, o
      # .exe (100 MB) não, e nada avisa. O build ainda gera o `latest.yml` e o
      # `app-update.yml` normalmente, que é o que importa aqui.
      - name: Build do instalador
        run: npm run build:win -- --publish never

      # O electron-builder descobre o repositório pelo remote do git. Se isso
      # falhar, ele ainda gera o instalador — só que sem feed, e o app
      # instalado nunca mais se atualiza. Melhor quebrar aqui do que descobrir
      # depois de distribuir.
      - name: Conferir se o instalador saiu com o feed de atualização
        shell: pwsh
        run: |
          $f = 'dist/win-unpacked/resources/app-update.yml'
          if (!(Test-Path $f)) { throw "app-update.yml não foi gerado" }
          $content = Get-Content $f -Raw
          Write-Host $content
          if ($content -notmatch 'provider:\s*github') {
            throw "app-update.yml sem provider github — o app instalado não conseguiria se atualizar"
          }

      # Sem o .exe não há o que instalar; sem o latest.yml o app instalado não
      # enxerga a atualização. Conferir antes de subir evita criar uma release
      # pela metade.
      - name: Enviar os artefatos para a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (!$exe) { throw "o build não gerou o instalador .exe" }
          if (!(Test-Path dist/latest.yml)) {
            throw "o build não gerou latest.yml — o auto-update não funcionaria"
          }
          # O .blockmap é opcional: só faz a atualização baixar as partes que
          # mudaram. Vai junto quando existe.
          $arquivos = @($exe.FullName, (Resolve-Path dist/latest.yml).Path)
          $blockmap = Get-ChildItem dist -Filter *.exe.blockmap | Select-Object -First 1
          if ($blockmap) { $arquivos += $blockmap.FullName }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @arquivos --clobber
          } else {
            gh release create $tag @arquivos --draft --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "falha ao enviar os artefatos" }

      # A release nasce como rascunho e só sai do rascunho depois de confirmar,
      # já no GitHub, que os artefatos chegaram mesmo.
      - name: Publicar a release (só com os artefatos completos)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          # -join é essencial: sobre um array, o -match do PowerShell devolve os
          # elementos que casam, não um booleano — e array não-vazio é sempre
          # "verdadeiro", o que fazia a checagem falhar com os artefatos certos.
          $assets = (gh release view $tag --json assets --jq '.assets[].name') -join ' '
          Write-Host "Artefatos: $assets"
          if ($assets -notmatch '\.exe(\s|$)') {
            throw "Release $tag sem o instalador .exe"
          }
          if ($assets -notmatch 'latest\.yml') {
            throw "Release $tag sem latest.yml — o auto-update não funcionaria"
          }
          gh release edit $tag --draft=false
          Write-Host "Release $tag publicada"
