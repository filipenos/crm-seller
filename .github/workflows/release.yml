name: Release

# Publica o instalador Windows nas Releases do GitHub. É esse artefato que o
# app instalado consulta para se atualizar sozinho (electron-updater).
#
# Como disparar:
#   npm version 0.2.0        # sobe a versão e cria a tag v0.2.0
#   git push --follow-tags
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # necessário para criar a release e subir os artefatos
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      # O postinstall (electron-builder install-app-deps) recompila o
      # better-sqlite3 para o Electron do Windows aqui no runner — é por isso
      # que o build não sai do Ubuntu/Mac.
      - run: npm ci

      - run: npm run typecheck

      # `--publish never`: quem sobe os artefatos é o passo seguinte, com o `gh`.
      # O publisher do electron-builder roda duas vezes e cria **duas releases
      # rascunho com a mesma tag**, dividindo os artefatos entre elas — numa
      # ficou o .blockmap, na outra o .exe e o latest.yml. Como a tag deixa de
      # identificar uma release só, conferir o resultado vira sorteio. O build
      # ainda gera o `latest.yml` e o `app-update.yml`, que é o que importa aqui.
      - name: Build do instalador
        run: npm run build:win -- --publish never

      # O electron-builder descobre o repositório pelo remote do git. Se isso
      # falhar, ele ainda gera o instalador — só que sem feed, e o app
      # instalado nunca mais se atualiza. Melhor quebrar aqui do que descobrir
      # depois de distribuir.
      - name: Conferir se o instalador saiu com o feed de atualização
        shell: pwsh
        run: |
          $f = 'dist/win-unpacked/resources/app-update.yml'
          if (!(Test-Path $f)) { throw "app-update.yml não foi gerado" }
          $content = Get-Content $f -Raw
          Write-Host $content
          if ($content -notmatch 'provider:\s*github') {
            throw "app-update.yml sem provider github — o app instalado não conseguiria se atualizar"
          }

      # Sem o .exe não há o que instalar; sem o latest.yml o app instalado não
      # enxerga a atualização. Conferir antes de subir evita criar uma release
      # pela metade.
      #
      # O nome do arquivo não é detalhe: o instalador sai do build com espaços
      # ("CRM Seller Setup 0.3.1.exe") e o GitHub troca espaço por ponto ao
      # receber o artefato, enquanto o latest.yml — que é o endereço que o app
      # instalado vai buscar — registra a versão com hífens. Nomes diferentes,
      # download 404, e a atualização falha só na máquina do usuário. Renomear
      # depois não resolve: o GitHub mantém o endereço antigo morto.
      - name: Enviar os artefatos para a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          if (!(Test-Path dist/latest.yml)) {
            throw "o build não gerou latest.yml — o auto-update não funcionaria"
          }
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (!$exe) { throw "o build não gerou o instalador .exe" }

          # O nome que o app instalado vai pedir, dito pelo próprio latest.yml.
          $alvo = (Select-String -Path dist/latest.yml -Pattern '^path:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $blockmap = Get-ChildItem dist -Filter *.exe.blockmap | Select-Object -First 1
          if ($exe.Name -ne $alvo) {
            Move-Item $exe.FullName (Join-Path dist $alvo)
            # O .blockmap é opcional (só faz a atualização baixar as partes que
            # mudaram), mas é procurado como "<nome do exe>.blockmap".
            if ($blockmap) { Move-Item $blockmap.FullName (Join-Path dist "$alvo.blockmap") }
          }

          $arquivos = @((Resolve-Path (Join-Path dist $alvo)).Path, (Resolve-Path dist/latest.yml).Path)
          if (Test-Path (Join-Path dist "$alvo.blockmap")) {
            $arquivos += (Resolve-Path (Join-Path dist "$alvo.blockmap")).Path
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @arquivos --clobber
          } else {
            gh release create $tag @arquivos --draft --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "falha ao enviar os artefatos" }

      # A release nasce como rascunho e só sai do rascunho depois de confirmar,
      # já no GitHub, que os artefatos chegaram mesmo.
      - name: Publicar a release (só com os artefatos completos)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          # -join é essencial: sobre um array, o -match do PowerShell devolve os
          # elementos que casam, não um booleano — e array não-vazio é sempre
          # "verdadeiro", o que fazia a checagem falhar com os artefatos certos.
          $assets = (gh release view $tag --json assets --jq '.assets[].name') -join ' '
          Write-Host "Artefatos: $assets"
          if ($assets -notmatch '\.exe(\s|$)') {
            throw "Release $tag sem o instalador .exe"
          }
          if ($assets -notmatch 'latest\.yml') {
            throw "Release $tag sem latest.yml — o auto-update não funcionaria"
          }
          gh release edit $tag --draft=false
          Write-Host "Release $tag publicada"

      # A conferência que importa de verdade: baixar o mesmo endereço que o app
      # instalado vai pedir. Nome de artefato certo e download quebrado é o
      # tipo de falha que só aparece na máquina do usuário, dias depois.
      - name: Conferir se a atualização é baixável
        shell: pwsh
        run: |
          $tag = "v$((Get-Content package.json | ConvertFrom-Json).version)"
          $alvo = (Select-String -Path dist/latest.yml -Pattern '^path:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$alvo"
          Write-Host "Endereço da atualização: $url"
          # A release recém-publicada leva alguns segundos para responder.
          foreach ($tentativa in 1..5) {
            $r = Invoke-WebRequest -Uri $url -Method Head -SkipHttpErrorCheck
            if ($r.StatusCode -eq 200) {
              Write-Host "Atualização baixável (tentativa $tentativa)"
              exit 0
            }
            Start-Sleep -Seconds 10
          }
          throw "o instalador anunciado no latest.yml não pôde ser baixado ($url)"
