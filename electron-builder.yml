appId: com.filipenos.crmseller
productName: CRM Seller
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
nsis:
  oneClick: false
  # Instalação por usuário, em pasta fixa: é o que permite a atualização se
  # instalar sozinha, sem pedir permissão de administrador toda vez.
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: CRM Seller
# Feed das atualizações. owner/repo vêm do remote git (ou de GITHUB_REPOSITORY
# no CI), então o instalador já sai apontando para o repositório certo.
publish:
  provider: github
  # Mantido como RASCUNHO de propósito. Com `releaseType: release` o
  # electron-builder começa a subir os artefatos antes de a release existir e
  # encerra com sucesso no meio do upload: sobe o .blockmap (100 KB), perde o
  # .exe (100 MB) e não gera o latest.yml. Quem publica é o workflow, depois de
  # conferir que os artefatos chegaram.
  releaseType: draft
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Filipe Peixoto <filipenos@gmail.com>
npmRebuild: true
