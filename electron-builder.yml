appId: com.filipenos.crmseller
productName: CRM Seller
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
nsis:
  oneClick: false
  # Instalação por usuário, em pasta fixa: é o que permite a atualização se
  # instalar sozinha, sem pedir permissão de administrador toda vez.
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: CRM Seller
# Feed das atualizações. owner/repo vêm do remote git (ou de GITHUB_REPOSITORY
# no CI), então o instalador já sai apontando para o repositório certo.
publish:
  provider: github
  # Este bloco serve só para *gerar* o `latest.yml` e o `app-update.yml`: o
  # workflow roda com `--publish never` e sobe os artefatos com o `gh`, porque
  # o uploader daqui encerra o processo no meio do upload (sobe o .blockmap de
  # 100 KB, perde o .exe de 100 MB, e sai com sucesso).
  releaseType: draft
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Filipe Peixoto <filipenos@gmail.com>
npmRebuild: true
