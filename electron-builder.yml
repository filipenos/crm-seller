appId: com.filipenos.crmseller
productName: CRM Seller
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: extension
    to: chrome-extension
    filter:
      - manifest.json
      - background.js
      - popup.html
      - popup.js
# Mantém os controles nativos e mensagens do Chromium sempre em português do
# Brasil também nas versões instaladas para Windows, macOS e Linux.
electronLanguages:
  - pt-BR
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
nsis:
  # Usa sempre a instalação por usuário já adotada pelo app. O instalador
  # assistido permitia escolher "todos os usuários", criando outra instalação
  # e solicitando elevação ao atualizar a cópia em AppData.
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  shortcutName: CRM Seller
# Feed das atualizações. owner/repo vêm do remote git (ou de GITHUB_REPOSITORY
# no CI), então o instalador já sai apontando para o repositório certo.
publish:
  provider: github
  # Este bloco serve só para *gerar* o `latest.yml` e o `app-update.yml`: o
  # workflow roda com `--publish never` e sobe os artefatos com o `gh`, porque
  # o publisher daqui cria duas releases rascunho com a mesma tag e espalha os
  # artefatos entre as duas.
  releaseType: draft
mac:
  target:
    - dmg
    - zip
  category: public.app-category.business
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Filipe Peixoto <filipenos@gmail.com>
npmRebuild: true
